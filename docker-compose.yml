version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: web_b2b_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: web_b2b
      MYSQL_USER: web_b2b_user
      MYSQL_PASSWORD: user123456
      TZ: 'Asia/Shanghai'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - web_b2b_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: web_b2b_server
    restart: always
    command: gunicorn server.wsgi:application --bind 0.0.0.0:8000 --workers 4
    environment:
      DEBUG: 'False'
      ALLOWED_HOSTS: '8.208.93.138,localhost,127.0.0.1'
      DATABASE_URL: 'mysql://web_b2b_user:user123456@mysql:3306/web_b2b'
      DJANGO_SETTINGS_MODULE: 'server.settings'
      DB_NAME: 'web_b2b'
      DB_USER: 'web_b2b_user'
      DB_PASSWORD: 'user123456'
      DB_HOST: 'mysql'
      DB_PORT: '3306'
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - ./server/media:/app/media
      - ./server/upload:/app/upload
      - ./server/static:/app/static
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web_b2b_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web_b2b_web
    restart: always
    environment:
      NODE_ENV: 'production'
      NEXT_PUBLIC_API_URL: 'http://8.208.93.138/myapp'
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    networks:
      - web_b2b_network

  nginx:
    image: nginx:latest
    container_name: web_b2b_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./b2b.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/upload:/var/www/upload:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - web_b2b_network

networks:
  web_b2b_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
